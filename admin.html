<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADMIN DASHBOARD | SATYX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand"><span class="brand-logo-text">SATYX CONTROL</span></a>
    </div>
  </header>

  <main class="container section-spacing">
    <div id="admin-login-view" style="max-width:450px; margin:0 auto; background-color:var(--bg-surface); padding:2rem; border:1px solid var(--bg-border);">
      <h2 class="heading-md" style="margin-bottom:1.5rem;">ADMIN AUTHENTICATION</h2>
      <form id="admin-login-form">
        <div class="form-group">
          <label class="form-label">ADMIN EMAIL</label>
          <input type="email" id="admin-email" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">PASSWORD</label>
          <input type="password" id="admin-password" class="form-input" required>
        </div>
        <button type="submit" class="btn btn-accent btn-full">LOGIN TO SYSTEM</button>
      </form>
    </div>

    <div id="admin-dashboard-view" style="display:none;">
      <h1 class="heading-xl" style="margin-bottom:2rem;">SYSTEM OVERVIEW</h1>
      
      <div class="grid-4" style="margin-bottom:3rem;">
        <div style="background-color:var(--bg-surface); padding:1.5rem; border:1px solid var(--bg-border);">
          <p class="text-mono" style="color:var(--text-muted)">REVENUE</p>
          <h2 class="heading-md" id="metric-revenue">₹0</h2>
        </div>
        <div style="background-color:var(--bg-surface); padding:1.5rem; border:1px solid var(--bg-border);">
          <p class="text-mono" style="color:var(--text-muted)">TOTAL ORDERS</p>
          <h2 class="heading-md" id="metric-orders">0</h2>
        </div>
        <div style="background-color:var(--bg-surface); padding:1.5rem; border:1px solid var(--bg-border);">
          <p class="text-mono" style="color:var(--text-muted)">PRODUCTS</p>
          <h2 class="heading-md" id="metric-products">0</h2>
        </div>
        <div style="background-color:var(--bg-surface); padding:1.5rem; border:1px solid var(--bg-border);">
          <p class="text-mono" style="color:var(--text-muted)">CUSTOMERS</p>
          <h2 class="heading-md" id="metric-customers">0</h2>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
