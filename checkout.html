<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHECKOUT | SATYX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand"><span class="brand-logo-text">SATYX</span></a>
    </div>
  </header>

  <main class="container section-spacing">
    <h1 class="heading-xl" style="margin-bottom:2rem;">CHECKOUT</h1>
    <form id="checkout-form" class="grid-2">
      <div>
        <h3 class="heading-md" style="margin-bottom:1.5rem;">SHIPPING DETAILS</h3>
        <div class="form-group">
          <label class="form-label">FULL NAME</label>
          <input type="text" id="c-name" class="form-input" required>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">EMAIL ADDRESS</label>
            <input type="email" id="c-email" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">MOBILE NUMBER</label>
            <input type="tel" id="c-mobile" class="form-input" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">DELIVERY ADDRESS</label>
          <input type="text" id="c-address" class="form-input" required>
        </div>
        <div class="grid-3">
          <div class="form-group">
            <label class="form-label">CITY</label>
            <input type="text" id="c-city" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">STATE</label>
            <input type="text" id="c-state" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">PINCODE</label>
            <input type="text" id="c-pincode" class="form-input" required>
          </div>
        </div>
      </div>

      <div style="background-color: var(--bg-surface); padding:2rem; border:1px solid var(--bg-border); height:fit-content;">
        <h3 class="heading-md" style="margin-bottom:1.5rem;">PAYMENT METHOD</h3>
        <div class="form-group">
          <select id="c-payment" class="form-select">
            <option value="COD">CASH ON DELIVERY (COD)</option>
            <option value="ONLINE">ONLINE PAYMENT (UPI/CARDS) - GATEWAY READY</option>
          </select>
        </div>
        <div style="display:flex; justify-content:space-between; margin:2rem 0; font-weight:700; border-top:1px solid var(--bg-border); padding-top:1rem;">
          <span>FINAL AMOUNT</span>
          <span id="checkout-total">₹0</span>
        </div>
        <button type="submit" class="btn btn-accent btn-full">PLACE ORDER</button>
      </div>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
