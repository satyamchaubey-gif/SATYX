<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOUR CART | SATYX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand"><span class="brand-logo-text">SATYX</span></a>
      <ul class="nav-links" id="nav-links">
        <li><a href="shop.html" class="nav-link">SHOP</a></li>
        <li><a href="drop-001.html" class="nav-link">DROP 001</a></li>
        <li><a href="about.html" class="nav-link">ABOUT</a></li>
        <li><a href="account.html" class="nav-link">ACCOUNT</a></li>
      </ul>
      <div class="nav-actions">
        <a href="cart.html" class="cart-icon-wrapper nav-link active">CART [<span id="cart-badge-count">0</span>]</a>
      </div>
    </div>
  </header>

  <main class="container section-spacing">
    <h1 class="heading-xl" style="margin-bottom:2rem;">SHOPPING CART</h1>
    <div class="grid-2">
      <div id="cart-items-container">
        <!-- Dynamic Cart Items -->
      </div>
      <div id="cart-summary" style="background-color: var(--bg-surface); padding:2rem; border:1px solid var(--bg-border); height:fit-content;">
        <h3 class="heading-md" style="margin-bottom:1.5rem;">ORDER SUMMARY</h3>
        <div style="display:flex; justify-content:space-between; margin-bottom:1rem;" class="text-mono">
          <span>SUBTOTAL</span><span id="cart-subtotal">₹0</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom:1.5rem;" class="text-mono">
          <span>ESTIMATED SHIPPING</span><span id="cart-shipping">₹0</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom:2rem; border-top:1px solid var(--bg-border); padding-top:1rem; font-weight:700;">
          <span>TOTAL</span><span id="cart-total">₹0</span>
        </div>
        <a href="checkout.html" class="btn btn-accent btn-full">PROCEED TO CHECKOUT</a>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
