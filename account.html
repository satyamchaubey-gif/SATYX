<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACCOUNT | SATYX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand"><span class="brand-logo-text">SATYX</span></a>
      <ul class="nav-links" id="nav-links">
        <li><a href="shop.html" class="nav-link">SHOP</a></li>
        <li><a href="drop-001.html" class="nav-link">DROP 001</a></li>
        <li><a href="about.html" class="nav-link">ABOUT</a></li>
        <li><a href="account.html" class="nav-link active">ACCOUNT</a></li>
      </ul>
      <div class="nav-actions">
        <a href="cart.html" class="cart-icon-wrapper nav-link">CART [<span id="cart-badge-count">0</span>]</a>
      </div>
    </div>
  </header>

  <main class="container section-spacing">
    <div id="account-auth" class="grid-2">
      <div style="background-color:var(--bg-surface); padding:2rem; border:1px solid var(--bg-border);">
        <h2 class="heading-md" style="margin-bottom:1.5rem;">SIGN IN</h2>
        <form id="login-form">
          <div class="form-group">
            <label class="form-label">EMAIL ADDRESS</label>
            <input type="email" id="login-email" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">PASSWORD</label>
            <input type="password" id="login-password" class="form-input" required>
          </div>
          <button type="submit" class="btn btn-primary btn-full">LOGIN</button>
        </form>
      </div>

      <div style="background-color:var(--bg-surface); padding:2rem; border:1px solid var(--bg-border);">
        <h2 class="heading-md" style="margin-bottom:1.5rem;">REGISTER</h2>
        <form id="register-form">
          <div class="form-group">
            <label class="form-label">FULL NAME</label>
            <input type="text" id="reg-name" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">EMAIL ADDRESS</label>
            <input type="email" id="reg-email" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">MOBILE NUMBER</label>
            <input type="tel" id="reg-mobile" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">PASSWORD</label>
            <input type="password" id="reg-password" class="form-input" required>
          </div>
          <button type="submit" class="btn btn-accent btn-full">CREATE ACCOUNT</button>
        </form>
      </div>
    </div>

    <div id="account-dashboard" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:3rem;">
        <div>
          <h1 class="heading-xl">MY ACCOUNT</h1>
          <p id="user-name-display" style="color:var(--accent-red);" class="text-mono"></p>
        </div>
        <button onclick="logoutUser()" class="btn btn-outline">LOGOUT</button>
      </div>

      <div class="grid-2">
        <div>
          <h3 class="heading-md" style="margin-bottom:1.5rem;">ACCOUNT DETAILS</h3>
          <p class="text-mono">EMAIL: <span id="user-email-display" style="color:var(--text-muted)"></span></p>
          <p class="text-mono">MOBILE: <span id="user-mobile-display" style="color:var(--text-muted)"></span></p>
        </div>
        <div>
          <h3 class="heading-md" style="margin-bottom:1.5rem;">ORDER HISTORY</h3>
          <div id="orders-history-container">
            <!-- Dynamic Order History -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
